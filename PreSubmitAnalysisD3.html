<!DOCTYPE html>
<html>
<head>
    <title>Presubmit Pass Rates</title>
    <script src="https://d3js.org/d3.v6.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .bar-label {
            font-size: 14px;
            text-anchor: middle;
        }
        .tooltip {
            position: absolute;
            background-color: white;
            padding: 5px;
            border: 1px solid black;
            border-radius: 5px;
            pointer-events: none;  // to prevent the tooltip itself from triggering mouse events
        }
        .message {
            font-size: 20px;
            font-family: sans-serif;
            margin: 40px;
        }
        /* one row per bucket, so the two projects sit side by side */
        .chart-row {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 20px;
        }
        .file-label {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<script>
    window.onload = function() {
        var jsonFiles = ["./data/presubmit_jobs_ovn.json", "./data/presubmit_jobs_cno.json"];

        // The data files are rewritten every 6 hours but GitHub Pages serves
        // them with max-age=600, so a cached copy easily outlives its contents.
        var cacheBuster = "?t=" + Date.now();
        var dataPromises = jsonFiles.map(file => d3.json(file + cacheBuster));
        Promise.all(dataPromises).then(rawData => {
            // A data file is null or empty when the update workflow could not
            // collect anything, which used to render a silently blank page.
            var allData = rawData.map(data => Array.isArray(data) ? data : []);
            if (allData.every(data => data.length === 0)) {
                showMessage("No presubmit job data available. Check the \"Update Presubmit Job Data\" workflow.");
                return;
            }

            // Both projects share a row per bucket, so the same category can be
            // compared across projects without scrolling.
            var gatingRow = d3.select("body").append("div").attr("class", "chart-row");
            var autoRunRow = d3.select("body").append("div").attr("class", "chart-row");
            var manualRow = d3.select("body").append("div").attr("class", "chart-row");

            allData.forEach((data, index) => {
                // optional decides whether a job blocks the PR; always_run decides
                // whether it runs by itself. The two together give three categories
                // that mean quite different things, and a non-gating job that runs
                // on every PR is far stronger evidence than one somebody triggered
                // by hand a handful of times.
                var gatingJobs = data.filter(job => !job.Optional);
                var autoRunJobs = data.filter(job => job.Optional && job.AlwaysRun);
                var manualJobs = data.filter(job => job.Optional && !job.AlwaysRun);
                var projectName = jsonFiles[index].match(/presubmit_jobs_(\w+)\.json/)[1].toUpperCase();

                gatingJobs.sort((a, b) => b.PassRate - a.PassRate);
                autoRunJobs.sort((a, b) => b.PassRate - a.PassRate);
                manualJobs.sort((a, b) => b.PassRate - a.PassRate);

                createChart(gatingJobs, gatingRow, projectName + " - Gating");
                createChart(autoRunJobs, autoRunRow, projectName + " - Auto-Run, Non-Gating");
                createChart(manualJobs, manualRow, projectName + " - Manual Trigger, Non-Gating");
            });
        }).catch(error => {
            showMessage("Failed to load presubmit job data: " + error);
        });
    }

    function showMessage(text) {
        d3.select("body").append("div").attr("class", "message").text(text);
    }

    // Every job in a chart carries the same pull-ci-openshift-<project>-<branch>-
    // prefix, which costs more label width than the part that differs.
    function shortName(name) {
        return name.replace(/^pull-ci-openshift-[a-z0-9-]*?-(?:main|master)-/, "");
    }

    function createChart(jobs, container, title) {
        var margin = {top: 60, right: 40, bottom: 40, left: 440},
            barHeight = 20,
            barSpace = 15,
            // size each chart to its own job count so the bars stay the same
            // thickness whether a bucket holds 8 jobs or 22
            height = Math.max(jobs.length, 1) * (barHeight + barSpace),
            width = 420;

        var barData = jobs.map(job => ({
            jobName: shortName(job.Name),
            passRate: job.PassRate
        }));

        var y = d3.scaleBand()
            .range([0, height])
            .padding(0.1)
            .domain(barData.map(d => d.jobName));

        var x = d3.scaleLinear()
            .range([0, width])
            .domain([0, 1]); // The domain is [0, 1] since the pass rates are percentages

        var gradientId = "svgGradient" + title.replace(/[^A-Za-z0-9]/g, "");

        var svg = container.append("svg")
            .attr("width", width + margin.left + margin.right)
            .attr("height", height + margin.top + margin.bottom)
            .append("g")
            .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

        svg.append("text")
            .attr("x", (width / 2))
            .attr("y", -(margin.top / 2))
            .attr("text-anchor", "middle")
            .style("font-size", "22px")
            .style("font-weight", "bold")
            .text(title);

        // A category can legitimately be empty, so say so rather than drawing
        // an axis with nothing on it.
        if (jobs.length === 0) {
            svg.append("text")
                .attr("x", (width / 2))
                .attr("y", barHeight)
                .attr("text-anchor", "middle")
                .style("font-size", "14px")
                .style("fill", "#666")
                .text("no jobs in this category");
            return;
        }

        // Define gradient
        var defs = svg.append("defs");
        var gradient = defs.append("linearGradient")
            .attr("id", gradientId) // Making the gradient ID unique for each chart
            .attr("x1", "0%")
            .attr("x2", "100%") // Gradient direction changed to horizontal
            .attr("y1", "0%")
            .attr("y2", "0%");

        gradient.append("stop")
            .attr('class', 'start')
            .attr("offset", "0%")
            .attr("stop-color", "red")
            .attr("stop-opacity", 1);

        gradient.append("stop")
            .attr('class', 'end')
            .attr("offset", "100%")
            .attr("stop-color", "green")
            .attr("stop-opacity", 1);

        svg.selectAll(".bar")
            .data(barData)
            .enter().append("rect")
            .attr("class", "bar")
            .attr("y", function(d) { return y(d.jobName); })
            .attr("height", y.bandwidth())
            .attr("x", 0)
            .attr("width", function(d) { return x(d.passRate); })
            .style("fill", "url(#" + gradientId + ")");

        var xAxis = d3.axisBottom(x).tickFormat(d3.format(".0%"));
        svg.append("g").attr("transform", "translate(0," + height + ")").call(xAxis);

        var yAxis = d3.axisLeft(y)
            .tickFormat(function(d, i) {
                return barData[i].jobName + " (" + (barData[i].passRate * 100).toFixed(0) + '%)';
            });

        svg.append("g")
            .call(yAxis)
            .selectAll("text")
            .style("font-size", "13px");
    }
</script>
</body>
</html>
